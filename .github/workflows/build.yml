name: APK derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/navinavi.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/navinavi.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret'ı yok, geçici imza kullanılacak (APK eskisinin üstüne kurulamaz)."
          fi

      - name: Debug APK derle
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: navinavi-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
