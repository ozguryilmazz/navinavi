name: APK derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/navinavi.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/navinavi.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret'ı yok, geçici imza kullanılacak (APK eskisinin üstüne kurulamaz)."
          fi

      - name: Debug APK derle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "navinavi-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: navinavi-${{ github.run_number }}
          path: navinavi-${{ github.run_number }}.apk

      # Uygulama içi güncelleme bu release'leri okur. Sadece sabit imzalı
      # main derlemeleri yayımlanır; yoksa telefondaki sürümün üstüne kurulamaz.
      - name: Release yayımla
        if: github.ref == 'refs/heads/main' && env.KEYSTORE_PATH != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "b${{ github.run_number }}" "navinavi-${{ github.run_number }}.apk" \
            --title "NaviNavi 0.1.${{ github.run_number }}" \
            --notes "$NOTES" \
            --latest
